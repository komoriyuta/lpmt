[package]
name = "lpmt-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Media assets, decoding, playback and capture for LPMT"

[features]
default = []
video = ["dep:ffmpeg-next"]
audio = ["dep:rodio"]
pipewire = ["dep:ashpd", "dep:async-io", "dep:futures-lite", "dep:pipewire"]

[dependencies]
anyhow.workspace = true
ffmpeg-next = { workspace = true, optional = true }
image.workspace = true
log.workspace = true
lpmt-core = { path = "../lpmt-core" }
rodio = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"], optional = true }
async-io = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }
pipewire = { version = "0.10", features = ["v0_3_65"], optional = true }

[[example]]
name = "decode-video"
required-features = ["video"]

[[example]]
name = "video-controls"
required-features = ["video"]
